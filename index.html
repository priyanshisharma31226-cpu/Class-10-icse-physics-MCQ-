<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICSE Physics Master - Force Quiz</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --success: #22c55e;
            --error: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        h1 {
            font-size: 22px;
            color: var(--primary);
            text-align: center;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 24px;
        }
        .question-box {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .option-btn {
            background: #f1f5f9;
            border: 2px solid #e2e8f0;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover:not(:disabled) {
            background: #e0e7ff;
            border-color: var(--primary);
        }
        .option-btn.correct {
            background: #dcfce7 !important;
            border-color: var(--success) !important;
            color: #166534;
        }
        .option-btn.incorrect {
            background: #fee2e2 !important;
            border-color: var(--error) !important;
            color: #991b1b;
        }
        .explanation {
            background: #eff6ff;
            border-left: 4px solid var(--primary);
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            display: none;
            font-weight: 600;
        }
        .next-btn:hover {
            opacity: 0.9;
        }
        .score-card {
            text-align: center;
            display: none;
        }
        .score-card h2 {
            font-size: 26px;
            color: var(--primary);
        }
    </style>
</head>
<body>

<div class="container" id="app">
    <h1>ICSE Physics Master</h1>
    <div class="subtitle">Class 10 — Chapter: Force (PYQ & Practice Quiz)</div>

    <div id="quiz-screen">
        <div id="progress" style="font-size: 13px; color: #64748b; margin-bottom: 8px;">Question 1 of 3</div>
        <div class="question-box" id="question-text">Loading question...</div>
        <div class="options-list" id="options-container"></div>
        <div class="explanation" id="explanation-box"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Next Question</button>
    </div>

    <div class="score-card" id="score-screen">
        <h2>Quiz Completed! 🎉</h2>
        <p id="final-score" style="font-size: 18px; margin: 20px 0;"></p>
        <button class="next-btn" style="display: block;" onclick="restartQuiz()">Try Again</button>
    </div>
</div>

<script>
    const quizData = [
        {
            question: "What is the SI unit of moment of force (torque)?",
            options: ["Newton (N)", "Newton-metre (N·m)", "Newton per metre (N/m)", "Newton-metre squared (N·m²)"],
            correct: 1,
            explanation: "Moment of force = Force × Perpendicular distance. Its SI unit is Newton-metre (N·m)."
        },
        {
            question: "Which of the following physical quantities is a vector quantity?",
            options: ["Work", "Power", "Moment of force", "Energy"],
            correct: 2,
            explanation: "Moment of force has both magnitude and direction, making it a vector quantity, whereas work, power, and energy are scalars."
        },
        {
            question: "Work done by the centripetal force in a uniform circular motion is always:",
            options: ["Maximum", "Minimum", "Zero", "Negative"],
            correct: 2,
            explanation: "Centripetal force is always perpendicular to the displacement (tangent to the circle), so Work = Fs cos(90°) = 0."
        }
    ];

    let currentQuestion = 0;
    let score = 0;
    let answered = false;

    const questionText = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options-container");
    const explanationBox = document.getElementById("explanation-box");
    const nextBtn = document.getElementById("next-btn");
    const progressText = document.getElementById("progress");
    const quizScreen = document.getElementById("quiz-screen");
    const scoreScreen = document.getElementById("score-screen");
    const finalScoreText = document.getElementById("final-score");

    function loadQuestion() {
        answered = false;
        explanationBox.style.display = "none";
        nextBtn.style.display = "none";
        
        const q = quizData[currentQuestion];
        progressText.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
        questionText.innerText = q.question;
        
        optionsContainer.innerHTML = "";
        q.options.forEach((opt, index) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = opt;
            btn.onclick = () => selectOption(index, btn);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(selectedIdx, btn) {
        if (answered) return;
        answered = true;

        const q = quizData[currentQuestion];
        const buttons = optionsContainer.getElementsByClassName("option-btn");

        if (selectedIdx === q.correct) {
            btn.classList.add("correct");
            score++;
        } else {
            btn.classList.add("incorrect");
            buttons[q.correct].classList.add("correct");
        }

        explanationBox.innerHTML = `<strong>Explanation:</strong> ${q.explanation}`;
        explanationBox.style.display = "block";
        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestion++;
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            quizScreen.style.display = "none";
            finalScoreText.innerText = `You scored ${score} out of ${quizData.length}!`;
            scoreScreen.style.display = "block";
        }
    }

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        scoreScreen.style.display = "none";
        quizScreen.style.display = "block";
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
